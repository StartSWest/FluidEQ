name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out FluidEQ
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ahead of the build because it is seconds and the build is minutes, and
      # a stylesheet that does not compile is thrown away silently rather than
      # failing the bundle.
      - name: Check the stylesheets
        run: pnpm typecheck:styles

      # Seconds, and it catches something every other check is blind to: a file
      # written back through a shell rather than an editor arrives with its
      # em-dashes double-encoded, and then compiles, lints and passes the whole
      # suite. Nine of them reached main that way, plus one inside a `title`
      # attribute that users could read on screen.
      - name: Check the file encodings
        run: pnpm typecheck:encoding

      - name: Build production bundles
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:unit --runInBand

      - name: Validate the bundled OPRA library
        run: pnpm test:opra
