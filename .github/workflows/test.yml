name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out FluidEQ
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ahead of the build because it is seconds and the build is minutes, and
      # a stylesheet that does not compile is thrown away silently rather than
      # failing the bundle.
      - name: Check the stylesheets
        run: pnpm typecheck:styles

      - name: Build production bundles
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:unit --runInBand

      - name: Validate the bundled OPRA library
        run: pnpm test:opra
