name: Test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # The complete app and evidence corpus exceed Node's 2 GiB Linux heap.
      # Keep the same checks on both hosts with room for the actual project.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out FluidEQ
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compile the actual Linux audio/window helpers on a clean runner;
      # a Windows-only green run cannot validate the Linux adaptations.
      - name: Install Linux build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev libpulse-dev libx11-dev libxext-dev

      # Ahead of the build because it is seconds and the build is minutes, and
      # a stylesheet that does not compile is thrown away silently rather than
      # failing the bundle.
      - name: Check the stylesheets
        run: pnpm typecheck:styles

      # Seconds, and it catches something every other check is blind to: a file
      # written back through a shell rather than an editor arrives with its
      # em-dashes double-encoded, and then compiles, lints and passes the whole
      # suite. Nine of them reached main that way, plus one inside a `title`
      # attribute that users could read on screen.
      - name: Check the file encodings
        run: pnpm typecheck:encoding

      # Neither ran on a push: a change that did not type-check reached main
      # green, as long as its tests passed. Seconds each against the build.
      - name: Type-check
        run: pnpm typecheck

      - name: Type-check the build scripts
        run: pnpm typecheck:scripts

      - name: Build production bundles
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:unit --runInBand

      - name: Render and measure factory music DSP
        run: pnpm test:music

      - name: Validate the complete native rack payload
        run: ctest --test-dir native/.build --output-on-failure -C Release -R "^room-contract$"

      - name: Validate Linux routing and shared engine integration
        if: runner.os == 'Linux'
        run: ctest --test-dir native/.build --output-on-failure -C Release -R "^(linux-parts|linux-output-engine)$"

      - name: Validate the bundled OPRA library
        run: pnpm test:opra
