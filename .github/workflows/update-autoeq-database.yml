name: Update AutoEq database

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-autoeq-database.yml'
      - 'scripts/update-autoeq.ps1'

permissions:
  contents: write

jobs:
  publish-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FluidEQ
        uses: actions/checkout@v4

      - name: Check out official AutoEq results
        uses: actions/checkout@v4
        with:
          repository: jaakkopasanen/AutoEq
          path: _official-autoeq
          fetch-depth: 1
          sparse-checkout: results

      - name: Build compact FluidEQ database
        shell: pwsh
        run: |
          ./scripts/update-autoeq.ps1 -UpstreamPath ./_official-autoeq
          $commit = (git -C ./_official-autoeq rev-parse HEAD).Trim()
          $models = @(Get-ChildItem ./autoeq -Directory).Count
          $profiles = @(Get-ChildItem ./autoeq -Recurse -File).Count
          $manifest = [ordered]@{
            version = 1
            sourceCommit = $commit
            modelCount = $models
            profileCount = $profiles
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content ./assets/autoeq-version.json -Encoding utf8NoBOM

      - name: Package database
        run: zip -qr autoeq-database.zip autoeq assets/autoeq-version.json

      - name: Publish update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view autoeq-database >/dev/null 2>&1 || \
            gh release create autoeq-database --title "FluidEQ AutoEq database" --notes "Automatically generated from the official AutoEq results."
          gh release upload autoeq-database autoeq-database.zip assets/autoeq-version.json --clobber
