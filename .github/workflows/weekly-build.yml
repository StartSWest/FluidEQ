# Does this still build from nothing?
#
# The most likely way FluidEQ dies is not a decision to stop — it is a year of
# quiet dependency churn, an Electron major, a toolchain that moved, and then
# somebody tries a clean checkout and cannot get it running in an afternoon. At
# that point the project is over whether or not anyone has said so, because the
# help that would revive it can no longer arrive.
#
# AQUA, which FluidEQ is forked from, stopped with a full roadmap and an open
# invitation to join. What it did not have was anything watching the tree while
# nobody was looking.
#
# So: a full cold build once a week, on a schedule rather than on a push,
# because rot happens on the weeks when there are no pushes. A red X within
# seven days of a break is the whole point. It costs nothing and it is the
# difference between a project that can be picked up and one that only looks
# like it can.

name: Weekly cold build

on:
  schedule:
    # Mondays, early. Far enough into the week that a break is noticed while
    # there is still time to care about it.
    - cron: '0 6 * * 1'
  # So it can be proven to work without waiting a week for it.
  workflow_dispatch:

jobs:
  cold-build:
    runs-on: windows-latest
    # Long enough for everything below to finish, and no longer. It was 45,
    # which stopped being enough somewhere between 2026-09-18 and the 1.7.5
    # cut: `pnpm test` is `jest && pnpm test:native-dsp`, and the native half
    # compiles the DSP core and runs its whole ctest suite — measured at 2,357
    # seconds for 70 tests on a developer machine, and a hosted runner is
    # slower. The room work added most of it, because those tests render real
    # rooms through the shipped heads at four sample rates.
    #
    # The job was cancelled at exactly 45 minutes, mid-suite, which reads on
    # the actions page as a cancelled build rather than a slow one — a guard
    # that can never go green is worse than no guard, because everybody learns
    # to ignore its red mark.
    #
    # Raise this when the suite grows again; never answer a timeout by taking
    # a check out of the job. A hung toolchain still cannot run forever.
    timeout-minutes: 120

    steps:
      - name: Check out FluidEQ
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # Deliberately NOT cached. A cache is exactly what hides the failure
          # this job exists to find: the question is whether a stranger with an
          # empty machine can build this, and a warm cache answers a different
          # and much easier question.
          cache: ''
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Type-check the end-to-end suite
        run: pnpm typecheck:e2e

      # Sass is the one language nothing else here checks: tsc does not see it,
      # jest does not import it, and prettier will format a file that cannot
      # compile. The script has existed for a while and nothing ever called it,
      # so it caught nothing — it also now rejects raw font-weight literals,
      # which is how eighteen of them accumulated unnoticed.
      - name: Check the stylesheets
        run: pnpm typecheck:styles

      # The same argument as the stylesheets: nothing else here can see it.
      # tsc, eslint, prettier and jest all accept a double-encoded em-dash
      # without a word, because the damage lands in comments — until the day it
      # lands in a string and a user reads it.
      - name: Check the file encodings
        run: pnpm typecheck:encoding

      # Before the tests, because jest's setup refuses to start without one —
      # it checks that the main and renderer bundles exist and throws if they
      # do not. On a developer's machine there is always a build lying around
      # from the last run, so this only shows up on a genuinely cold checkout,
      # which is the whole thing this job is here to reproduce.
      - name: Build the bundles
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # The real check. Everything above passes in a tree that cannot actually
      # produce an installer, which is the state AQUA is most likely in now.
      #
      # Not published — nothing here is signed and nothing here is a release.
      # It runs only to prove it still can.
      - name: Build the installer
        run: pnpm package
