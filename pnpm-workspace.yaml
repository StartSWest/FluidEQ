packages:
  - .
  - release/app

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  edgedriver: true
  electron: true
  electron-chromedriver: true
  electron-winstaller: true
  geckodriver: true
  lzma-native: true
  onnxruntime-node: false
  protobufjs: true
  sharp: false
  unrs-resolver: true

overrides:
  '@types/d3-dispatch': 3.0.7
  adm-zip: 0.6.0
  eslint: 8.57.1
  fast-uri: 3.1.6
  sharp: 0.35.0
  typescript: 6.0.3

storeDir: .pnpm-store
confirmModulesPurge: false
# ESLint 8 resolves plugins from the project root, and eslint-config-erb brings
# its plugins (prettier, airbnb, @typescript-eslint, ...) as its own
# dependencies. pnpm 10 stopped hoisting them to the root by default, so a
# bare `eslint` -- the editor's integration, or node_modules/eslint/bin run
# directly -- failed with "couldn't find the plugin eslint-plugin-prettier".
# `pnpm lint` and the pre-commit hook kept working only because pnpm puts its
# private hoist folder on NODE_PATH for anything it launches. This is the old
# default back, which is exactly what those pnpm-launched runs resolve.
# Editing this list makes the next install delete and rebuild node_modules.
# Close `pnpm dev` first: a running electron.exe cannot be deleted, and the
# purge stalls on it after everything else is already gone.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
patchedDependencies:
  '@huggingface/transformers@3.7.6': patches/@huggingface__transformers@3.7.6.patch
  music-metadata@11.14.0: patches/music-metadata@11.14.0.patch
  watchboy@0.4.3: patches/watchboy@0.4.3.patch
