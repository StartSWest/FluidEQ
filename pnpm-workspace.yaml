packages:
  - .
  - release/app

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  edgedriver: true
  electron: true
  electron-chromedriver: true
  electron-winstaller: true
  geckodriver: true
  lzma-native: true
  onnxruntime-node: false
  protobufjs: true
  sharp: false
  unrs-resolver: true

overrides:
  '@types/d3-dispatch': 3.0.7
  eslint: 8.57.1
  typescript: 6.0.3

storeDir: .pnpm-store
confirmModulesPurge: false
